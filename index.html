<!DOCTYPE html>
<html>

<head>
    <title>Dorian's Graveyard</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background-image: url("https://68.media.tumblr.com/6c7b7d8a627c8df83ff59870175957f1/tumblr_o30zqaVCpS1qg39ewo1_500.gif");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: white;
            font-family: Arial, sans-serif;
            cursor: url("images/cursor\ test\ 2.png") 16 16, auto;
        }

        .container {
            width: 70%;
            margin: 50px auto;
            padding: 40px;
            background: rgba(20, 20, 30, 0.7);
            backdrop-filter: blur(10px);
        }

        h1 {
            text-align: center;
            color: rgb(52, 114, 172);
            font-family: gothic;
            font-size: 50px;
        }

        .intro {
            text-align: center;
        }

        .boxes {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 40px;
        }

        .box {
            width: 30%;
            padding: 30px;
            box-sizing: border-box;
            background: rgba(255, 255, 255, 0.1);
            text-align: center;
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            width: 100%;
        }

        .game {
            min-width: 0;
            text-align: center;
        }

        .game img {
            width: 100%;
            max-width: 100%;
            aspect-ratio: 3 / 4;
            object-fit: cover;
        }

        .music-grid {
            display: grid;
            grid-template-columns: repeat(2,1fr);
            column-gap: 10px;
            row-gap: 20px;
        }

        .music img {
            width: 90%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            display: block;
            margin: auto;
            transition: transform 0.2s, opacity 0.2s;
        }

        .music img:hover {
            transform: scale(1.05);
            opacity: 0.8;
        }
    </style>
</head>

<body>

    <h1>Dorian's Graveyard</h1>

    <div class="container">

        <div class="intro">
            <h2>Ik ben Dorian</h2>
            <p>Welkom op mijn persoonlijke website.</p>
        </div>

        <div class="boxes">

            <div class="box">
                <h2>Music</h2>
                <p>Informatie over mijn muzieksmaak.</p>

                <div class="music-grid">

                    <div class="music">
                        <img src="images/RADIOHEAD_cover.jpg" alt="Radiohead">
                    </div>

                    <div class="music">
                        <img src="images/TRENCH_cover.jpg" alt="Trench">
                    </div>

                    <div class="music">
                        <img src="images/AmigoTheDevil_cover.jpg" alt="Amigo The Devil">
                    </div>

                    <div class="music">
                        <img src="https://www.roughtrade.com/_next/image?url=https%3A%2F%2Fcdn.shopify.com%2Fs%2Ffiles%2F1%2F0867%2F1120%2F6219%2Ffiles%2F2000x2000bb_427d9d7f-1b52-4eef-bfae-9b62f224ce6f.jpg%3Fv%3D1753975577&w=750&q=75" alt="Radiohead">
                    </div>
            </div>
        </div>

            <div class="box">
                <h2>Movies</h2>
                <p>Mijn favoriete films en series.</p>
            </div>

            <div class="box">
                <h2>Games</h2>
                <p>Games die ik leuk vind.</p>

                <div class="game-grid">

                    <div class="game">
                        <img src="images/RDR2_cover.jpg" alt="Red Dead Redemption 2">
                    </div>

                    <div class="game">
                        <img src="images/WINDROSE_cover.jpg" alt="Windrose">
                    </div>

                    <div class="game">
                        <img src="images/FF7Rebirth_cover.jpg" alt="Final Fantasy VII Rebirth"> 
                    </div>

                        <div class="game">
                            <img src="images/PHASMOPHOBIA_cover.jpg" alt="Phasmophobia"> 
                        </div>

                            <div class="game">
                                <img src="images/library_600x900_2x.jpg" alt="Terraria">
                            </div>

                            <div class="game">
                                <img src="images/PiratesOfTheCaribbean_cover.jpg" alt="Lego Pirates Of The Caribbean">
                            </div>

                        </div>
                    </div>

                </div>

            </div>

</body>

</html>
